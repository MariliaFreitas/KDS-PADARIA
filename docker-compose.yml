services:
  postgres:
    image: postgres:16-alpine
    container_name: kds-padaria-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kds_padaria
      POSTGRES_PASSWORD: kds_padaria
      POSTGRES_DB: kds_padaria
    ports:
      - "5432:5432"
    volumes:
      - kds_padaria_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kds_padaria -d kds_padaria"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  kds_padaria_postgres_data:
